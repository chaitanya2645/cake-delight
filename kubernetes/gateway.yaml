apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: cake-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:3001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3002"
            - name: RATING_SERVICE_URL
              value: "http://rating-service:3003"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3004"

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: NodePort
